<!doctype html>
<!-- data-brand selects the palette in web/app/styles/grid-tokens.css. Without it
     --grid-action falls back to the :root default (#e2661c, fadymondy's orange)
     and every primary button, focus ring and accent comes out the wrong colour.
     The web app sets the same attribute in web/app/layout.tsx. -->
<html lang="en" data-brand="zekra">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src *;"
    />
    <title>Zekra</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body class="grid-surface">
    <div id="root"></div>
    <script src="app.js"></script>
  </body>
</html>
