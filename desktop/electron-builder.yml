appId: dev.zekra.desktop
productName: Zekra
copyright: Copyright © Zekra (ذكرة)

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json
  - node_modules/**/*

# NOTE: icon.ico / icon.icns are placeholders-in-waiting — only build/icon.svg and a
# hand-generated build/icon.png (both derived from the real Zekra brand mark, see
# web/app/icon.svg / web/lib/brand) currently exist (no ImageMagick/rsvg-convert/sharp
# in this environment to derive real multi-resolution .ico/.icns). See README.md for
# the follow-up conversion step before a real packaged Windows/macOS build.
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  target:
    - dmg
  icon: build/icon.icns
  category: public.app-category.productivity

linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Utility
