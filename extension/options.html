<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title data-i18n="optionsTitle">Zekra - Options</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    body { max-width: 520px; margin: 0 auto; padding-bottom: 28px; }
    h1 { justify-content: flex-start; }
  </style>
</head>
<body>
  <h1><img src="icons/mark.svg" alt="" width="22" height="18" /> <span data-i18n="optionsTitle">Zekra - Options</span></h1>

  <div class="zk-card zk-stack">
    <div>
      <label class="zk-label" for="apiBase" data-i18n="apiBase">API base URL</label>
      <input id="apiBase" type="url" placeholder="https://app.zekra.dev" />
    </div>
    <div>
      <label class="zk-label" for="agentId" data-i18n="agentLabel">Agent label (X-Agent-Id, not a credential)</label>
      <input id="agentId" type="text" placeholder="extension" />
    </div>
    <button id="saveBtn" data-i18n="save">Save</button>
    <div id="status" class="zk-muted"></div>
  </div>

  <div class="zk-card zk-stack">
    <span class="zk-label" data-i18n="account">Account</span>
    <div id="authState" class="zk-muted"></div>
    <button id="signInBtn" data-i18n="connectButton">Connect Zekra account</button>
    <button id="signOutBtn" class="zk-danger" hidden data-i18n="disconnect">Disconnect</button>
  </div>

  <div class="zk-card zk-stack" id="tokenCard" hidden>
    <span class="zk-label" data-i18n="accessToken">Access token</span>
    <p class="zk-muted" data-i18n="accessTokenHint">The OAuth access token this grant issued. Use it as a Bearer token against the MCP endpoint. Treat it like a password.</p>
    <p id="tokenValue" class="zk-token"></p>
    <div class="zk-row">
      <button id="revealBtn" class="zk-secondary" data-i18n="show">Show</button>
      <button id="copyBtn" class="zk-secondary" data-i18n="copy">Copy</button>
    </div>
    <div id="tokenMeta" class="zk-muted"></div>
  </div>

  <script src="browser-shim.js"></script>
  <script src="options.js" type="module"></script>
</body>
</html>
