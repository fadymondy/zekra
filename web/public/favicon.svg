<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -5 50 50" shape-rendering="crispEdges">
  <!-- Zekra vault mark (lib/brand/marks.ts · zekra), normalised to its 5×4 box and centred in a
       square: violet body with the gold top cube, the same colours on light and dark chrome. -->
  <g fill="#6D4DE6">
    <rect x="10" y="10" width="10" height="10"/>
    <rect x="30" y="10" width="10" height="10"/>
    <rect x="0" y="20" width="10" height="10"/>
    <rect x="20" y="20" width="10" height="10"/>
    <rect x="40" y="20" width="10" height="10"/>
    <rect x="10" y="30" width="10" height="10"/>
    <rect x="30" y="30" width="10" height="10"/>
  </g>
  <rect x="20" y="0" width="10" height="10" fill="#C9A227"/>
</svg>
