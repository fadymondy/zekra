<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -5 50 50" shape-rendering="crispEdges">
  <!-- Zekra vault mark (grid-marks.ts · zekra), normalised to its 5×4 box and centred in a
       square. Tab-size favicons fall under the brand's 5px-cell rule, so the gold dome top is
       dropped and the whole mark takes the body colour: violet on light chrome, ivory on dark. -->
  <style>
    rect { fill: #6d4de6; }
    @media (prefers-color-scheme: dark) { rect { fill: #f0ebe1; } }
  </style>
  <rect x="20" y="0" width="10" height="10"/>
  <rect x="10" y="10" width="10" height="10"/>
  <rect x="30" y="10" width="10" height="10"/>
  <rect x="0" y="20" width="10" height="10"/>
  <rect x="20" y="20" width="10" height="10"/>
  <rect x="40" y="20" width="10" height="10"/>
  <rect x="10" y="30" width="10" height="10"/>
  <rect x="30" y="30" width="10" height="10"/>
</svg>
